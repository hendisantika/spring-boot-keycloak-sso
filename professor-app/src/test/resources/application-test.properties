# Test profile: in-memory H2 so the context can start in CI without MySQL / Keycloak
spring.datasource.url=jdbc:h2:mem:university;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database=h2
spring.jpa.hibernate.ddl-auto=create-drop

# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.app }} (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # required by the dependency submission step
    strategy:
      fail-fast: false
      matrix:
        app: [ professor-app, student-app ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: ${{ matrix.app }}/pom.xml

      - name: Build & test ${{ matrix.app }} with Maven
        run: mvn -B -ntp verify --file ${{ matrix.app }}/pom.xml

      # Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts.
      # Only on push to main: pull requests (e.g. from Dependabot) get a read-only token.
      - name: Update dependency graph
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1
        with:
          directory: ${{ matrix.app }}
          correlator: ${{ github.job }}-${{ matrix.app }}
